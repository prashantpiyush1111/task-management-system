<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow — Issues</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0b0f;--surface:#111318;--card:#161a22;--card2:#1c2130;--border:#1e2330;--accent:#4f7cff;--accent2:#7c5cfc;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#38bdf8;--text:#e8eaf0;--muted:#6b7280;--subtle:#374151}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;position:fixed;top:0;left:0;bottom:0;z-index:50}
.sl{display:flex;align-items:center;gap:9px;padding:0 16px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.li{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.lt{font-size:17px;font-weight:700}.lt span{color:var(--accent)}
.ns{padding:0 10px;margin-top:8px}
.nl{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:0 8px;margin:12px 0 4px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;transition:all .15s;cursor:pointer;position:relative}
.ni:hover{background:var(--card);color:var(--text)}
.ni.active{background:rgba(79,124,255,.1);color:var(--accent)}
.ni.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--accent);border-radius:2px}
.nico{font-size:15px;width:18px;text-align:center}
.nbadge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.sf{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--border)}
.uc{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;cursor:pointer;transition:background .15s;overflow:hidden}
.uc:hover{background:var(--card)}
.av{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.un{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.logout-btn{width:100%;margin-top:6px;padding:9px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px}
.logout-btn:hover{border-color:var(--danger);color:var(--danger)}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.page-title{font-size:18px;font-weight:700;letter-spacing:-.3px}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.tb-btn:hover{border-color:var(--accent);color:var(--accent)}
.tb-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600}
.tb-btn.primary:hover{opacity:.88}
.content{padding:24px 28px;flex:1}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-input{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.filter-input:focus{border-color:var(--accent)}
.filter-input::placeholder{color:var(--muted)}
.filter-select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none;cursor:pointer}
.filter-select option{background:var(--card)}
.filter-clear{background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;transition:all .2s}
.filter-clear:hover{border-color:var(--danger);color:var(--danger)}
.result-count{margin-left:auto;font-size:13px;color:var(--muted)}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-head{display:grid;grid-template-columns:100px 1fr 110px 90px 90px 160px 70px;gap:0;background:var(--card2);border-bottom:1px solid var(--border)}
.th{padding:11px 14px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.issue-row{display:grid;grid-template-columns:100px 1fr 110px 90px 90px 160px 70px;gap:0;border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer}
.issue-row:hover{background:var(--card2)}
.issue-row:last-child{border-bottom:none}
.td{padding:12px 14px;font-size:13px;display:flex;align-items:center}
.issue-key{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent)}
.issue-title-cell{font-weight:500;overflow:hidden}
.issue-title-cell span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.badge.todo{background:rgba(107,114,128,.15);color:#9ca3af}
.badge.inprog{background:rgba(79,124,255,.15);color:#93bbff}
.badge.done{background:rgba(34,197,94,.15);color:#4ade80}
.badge.blocked{background:rgba(239,68,68,.15);color:#f87171}
.badge.review{background:rgba(245,158,11,.15);color:#fbbf24}
.badge.open{background:rgba(56,189,248,.15);color:#7dd3fc}
.badge.high{background:rgba(239,68,68,.12);color:#f87171}
.badge.medium{background:rgba(245,158,11,.12);color:#fbbf24}
.badge.low{background:rgba(34,197,94,.12);color:#4ade80}
.badge.critical{background:rgba(124,92,252,.15);color:#c4b5fd}
.badge.task{background:rgba(79,124,255,.12);color:#93bbff}
.badge.bug{background:rgba(239,68,68,.12);color:#f87171}
.badge.story{background:rgba(34,197,94,.12);color:#4ade80}
.badge.epic{background:rgba(124,92,252,.12);color:#c4b5fd}
.action-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;border-radius:4px;transition:color .15s}
.action-btn:hover{color:var(--accent)}
.empty{text-align:center;padding:60px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-text{font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:40px 20px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:580px;position:relative;animation:min .25s ease}
@keyframes min{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.modal-title{font-size:18px;font-weight:700}
.mx{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px}.mx:hover{color:var(--text)}
.fg{margin-bottom:15px}
label{display:block;font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:6px;text-transform:uppercase;letter-spacing:.7px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 13px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.1)}
select option{background:var(--card2)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mbtn{padding:10px 20px;border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.mbtn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
.mbtn.primary:hover{opacity:.88}
.mbtn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.mbtn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.alert.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171}
.alert.show{display:block}
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:flex-end;z-index:150}
.detail-overlay.show{display:flex}
.detail-panel{width:480px;background:var(--surface);border-left:1px solid var(--border);height:100%;overflow-y:auto;padding:28px;animation:slideR .25s ease}
@keyframes slideR{from{transform:translateX(100%)}to{transform:translateX(0)}}
.det-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.det-key{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);margin-bottom:6px}
.det-title{font-size:18px;font-weight:700;line-height:1.3}
.det-section{margin-bottom:20px}
.det-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.det-val{font-size:13px;color:var(--text)}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.add-comment{display:flex;gap:10px;margin-top:14px}
.add-comment textarea{flex:1;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none;resize:none;min-height:70px}
.add-comment textarea:focus{border-color:var(--accent)}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sl"><div class="li">⚡</div><div class="lt">Task<span>Flow</span></div></div>
  <div class="ns">
    <div class="nl">Main</div>
    <a class="ni" href="dashboard.html"><span class="nico">⊞</span>Dashboard</a>
    <a class="ni active" href="issues.html"><span class="nico">📋</span>Issues</a>
    <a class="ni" href="board.html"><span class="nico">🗂</span>Board</a>
    <a class="ni" href="backlog.html"><span class="nico">📌</span>Backlog</a>
    <div class="nl">Planning</div>
    <a class="ni" href="sprints.html"><span class="nico">🏃</span>Sprints</a>
    <a class="ni" href="reports.html"><span class="nico">📊</span>Reports</a>
    <div class="nl">Settings</div>
    <a class="ni" href="workflows.html"><span class="nico">🔄</span>Workflows</a>
    <a class="ni" href="profile.html"><span class="nico">👤</span>Profile</a>
  </div>
  <div class="sf">
    <div class="uc">
      <div class="av" id="sideAvatar">U</div>
      <div style="min-width:0;flex:1">
        <div class="un" id="sideEmail">—</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">🚪 Sign Out</button>
  </div>
</nav>
<div class="main">
  <div class="topbar">
    <div class="page-title">Issues</div>
    <div class="tb-right"><button class="tb-btn primary" onclick="openCreate()">+ New Issue</button></div>
  </div>
  <div class="content">
    <div class="filters">
      <input class="filter-input" id="searchInput" placeholder="🔍 Search issues..." oninput="applyFilters()" style="width:240px"/>
      <select class="filter-select" id="statusFilter" onchange="applyFilters()">
        <option value="">All Status</option>
        <option value="OPEN">Open</option>
        <option value="TODO">Todo</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="IN_REVIEW">In Review</option>
        <option value="DONE">Done</option>
        <option value="BLOCKED">Blocked</option>
      </select>
      <select class="filter-select" id="priorityFilter" onchange="applyFilters()">
        <option value="">All Priority</option>
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
        <option value="CRITICAL">Critical</option>
      </select>
      <select class="filter-select" id="typeFilter" onchange="applyFilters()">
        <option value="">All Types</option>
        <option value="TASK">Task</option>
        <option value="BUG">Bug</option>
        <option value="STORY">Story</option>
        <option value="EPIC">Epic</option>
        <option value="SUB_TASK">Sub-task</option>
      </select>
      <button class="filter-clear" onclick="clearFilters()">✕ Clear</button>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="table-wrap">
      <div class="table-head">
        <div class="th">Key</div>
        <div class="th">Title</div>
        <div class="th">Status</div>
        <div class="th">Priority</div>
        <div class="th">Type</div>
        <div class="th">Assignee</div>
        <div class="th">Action</div>
      </div>
      <div id="issueTable"><div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Loading issues...</div></div></div>
    </div>
  </div>
</div>
<div class="overlay" id="createOverlay">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">Create Issue</div><button class="mx" onclick="closeCreate()">✕</button></div>
    <div class="alert err" id="createAlert"></div>
    <div class="fg"><label>Title *</label><input type="text" id="ciTitle" placeholder="Issue title"/></div>
    <div class="fg"><label>Description</label><textarea id="ciDesc" placeholder="Describe the issue..."></textarea></div>
    <div class="frow">
      <div class="fg"><label>Type</label><select id="ciType"><option value="TASK">Task</option><option value="BUG">Bug</option><option value="STORY">Story</option><option value="EPIC">Epic</option><option value="SUB_TASK">Sub-task</option></select></div>
      <div class="fg"><label>Priority</label><select id="ciPri"><option value="MEDIUM">Medium</option><option value="LOW">Low</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option></select></div>
    </div>
    <div class="fg"><label>Assignee Email</label><input type="email" id="ciAssignee" placeholder="assignee@company.com"/></div>
    <div class="modal-footer"><button class="mbtn ghost" onclick="closeCreate()">Cancel</button><button class="mbtn primary" onclick="doCreate()">Create</button></div>
  </div>
</div>
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-panel" id="detailPanel"></div>
</div>
<script>
const API = window.location.origin;
const token=localStorage.getItem('token');
if(!token)window.location.href='login.html';
const headers={'Content-Type':'application/json','Authorization':'Bearer '+token};
const email=localStorage.getItem('userEmail')||'';
document.getElementById('sideEmail').textContent=email;
document.getElementById('sideAvatar').textContent=email?email[0].toUpperCase():'U';
function logout(){localStorage.clear();window.location.href='login.html';}
let allIssues=[];
function statusBadge(s){const m={TODO:'todo',IN_PROGRESS:'inprog',DONE:'done',BLOCKED:'blocked',IN_REVIEW:'review',OPEN:'open'};return`<span class="badge ${m[s]||'open'}">${s||'OPEN'}</span>`}
function priorityBadge(p){const m={LOW:'low',MEDIUM:'medium',HIGH:'high',CRITICAL:'critical'};return`<span class="badge ${m[p]||'medium'}">${p||'—'}</span>`}
function typeBadge(t){const m={TASK:'task',BUG:'bug',STORY:'story',EPIC:'epic',SUB_TASK:'task'};return`<span class="badge ${m[t]||'task'}">${t||'TASK'}</span>`}
async function loadIssues(){
  try{
    // search ke bajaye directly sabhi issues laao by assignee ya all
    const res=await fetch(API+'/api/issues/search?dummy=1',{headers});
    if(res.ok){
      allIssues=await res.json();
      applyFilters();
    } else {
      // fallback — koi issue nahi mila
      allIssues=[];
      applyFilters();
      document.getElementById('issueTable').innerHTML='<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No issues found. Create one!</div></div>';
    }
  }catch(e){
    document.getElementById('issueTable').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Cannot connect to server</div></div>';
  }
}
function applyFilters(){
  const s=document.getElementById('searchInput').value.toLowerCase();
  const st=document.getElementById('statusFilter').value;
  const pr=document.getElementById('priorityFilter').value;
  const tp=document.getElementById('typeFilter').value;
  let filtered=allIssues.filter(i=>{
    const matchS=!s||(i.issueTitle||'').toLowerCase().includes(s)||(i.issueKey||'').toLowerCase().includes(s);
    const matchSt=!st||i.issueStatus===st;
    const matchPr=!pr||i.priority===pr;
    const matchTp=!tp||i.issueType===tp;
    return matchS&&matchSt&&matchPr&&matchTp;
  });
  document.getElementById('resultCount').textContent=`${filtered.length} issue${filtered.length!==1?'s':''}`;
  if(!filtered.length){document.getElementById('issueTable').innerHTML='<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No issues found</div></div>';return;}
  document.getElementById('issueTable').innerHTML=filtered.map(i=>`
    onclick="openDetail(${i.id})">
      <div class="td issue-key">${i.issueKey||'—'}</div>
      <div class="td issue-title-cell"><span>${i.issueTitle||'Untitled'}</span></div>
      <div class="td">${statusBadge(i.issueStatus)}</div>
      <div class="td">${priorityBadge(i.priority)}</div>
      <div class="td">${typeBadge(i.issueType)}</div>
      <div class="td" style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.assigneeEmail||'Unassigned'}</div>
      <div class="td"><button class="action-btn" onclick="event.stopPropagation();openDetail(${i.id})">👁</button></div>
    </div>`).join('');
}
function clearFilters(){
  document.getElementById('searchInput').value='';
  document.getElementById('statusFilter').value='';
  document.getElementById('priorityFilter').value='';
  document.getElementById('typeFilter').value='';
  applyFilters();
}
async function openDetail(id){
  try{
    const res=await fetch(API+'/api/issues/'+id,{headers});
    if(!res.ok)return;
    const i=await res.json();
    document.getElementById('detailPanel').innerHTML=`
      <div class="det-head">
        <div><div class="det-key">${i.issueKey||key}</div><div class="det-title">${i.issueTitle||'Untitled'}</div></div>
        <button class="mx" onclick="closeDetail()">✕</button>
      </div>
      <div class="det-grid">
        <div><div class="det-label">Status</div>${statusBadge(i.issueStatus)}</div>
        <div><div class="det-label">Priority</div>${priorityBadge(i.priority)}</div>
        <div><div class="det-label">Type</div><div class="det-val">${i.issueType||'—'}</div></div>
        <div><div class="det-label">Assignee</div><div class="det-val" style="font-size:12px">${i.assigneeEmail||'Unassigned'}</div></div>
        <div><div class="det-label">Reporter</div><div class="det-val" style="font-size:12px">${i.reporterEmail||'—'}</div></div>
        <div><div class="det-label">Sprint</div><div class="det-val">${i.sprintId||'No Sprint'}</div></div>
      </div>
      <div class="det-section"><div class="det-label">Description</div><div class="det-val" style="line-height:1.6;color:#d1d5db">${i.issueDescription||'No description'}</div></div>
      <div class="det-section">
        <div class="det-label">Update Status</div>
        <select onchange="updateStatus(${i.id}, this.value)" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none;width:100%">
          ${['OPEN','TODO','IN_PROGRESS','IN_REVIEW','DONE','BLOCKED','CLOSED'].map(s=>`<option value="${s}" ${i.issueStatus===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="det-section">
        <div class="det-label">Add Comment</div>
        <div class="add-comment"><textarea id="commentText" placeholder="Write a comment..."></textarea></div>
        <div style="display:flex;justify-content:flex-end;margin-top:8px">
          <button class="mbtn primary" onclick="addComment(${i.id})"" style="padding:8px 18px;font-size:13px">Post Comment</button>
        </div>
      </div>`;
    document.getElementById('detailOverlay').classList.add('show');
  }catch(e){}
}
function closeDetail(e){if(!e||e.target===document.getElementById('detailOverlay'))document.getElementById('detailOverlay').classList.remove('show');}
async function updateStatus(key,status){
  try{
    const res=await fetch(`${API}/api/issues/${key}/status?issueStatus=${status}`,{method:'PATCH',headers});
    if(res.ok)loadIssues();
  }catch(e){}
}
async function addComment(key){
  const body=document.getElementById('commentText').value.trim();
  if(!body)return;
  try{
    await fetch(`${API}/api/issues/${key}/comment`,{method:'POST',headers,body:JSON.stringify({body,authorEmail:email})});
    document.getElementById('commentText').value='';
  }catch(e){}
}
function openCreate(){document.getElementById('createOverlay').classList.add('show');}
function closeCreate(){document.getElementById('createOverlay').classList.remove('show');}
async function doCreate(){
  const title=document.getElementById('ciTitle').value.trim();
  if(!title){showCAlert('Title required');return;}
  try{
    const res=await fetch(API+'/api/issues/createIssue',{method:'POST',headers,body:JSON.stringify({
      issueTitle:title,issueDescription:document.getElementById('ciDesc').value,
      issueType:document.getElementById('ciType').value,priority:document.getElementById('ciPri').value,
      assigneeEmail:document.getElementById('ciAssignee').value||null,reporterEmail:email,issueStatus:'OPEN'
    })});
    if(!res.ok)throw new Error('Failed');
    closeCreate();loadIssues();
  }catch(e){showCAlert(e.message);}
}
function showCAlert(m){const el=document.getElementById('createAlert');el.textContent=m;el.className='alert err show';}
loadIssues();
</script>
</body>
