<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WorkFlow — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0b0f;--surface:#111318;--card:#161a22;--border:#1e2330;--accent:#4f7cff;--accent2:#7c5cfc;--success:#22c55e;--danger:#ef4444;--text:#e8eaf0;--muted:#6b7280}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(79,124,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(79,124,255,.04) 1px,transparent 1px);background-size:40px 40px}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.15}
.orb1{width:400px;height:400px;background:#4f7cff;top:-100px;left:-100px;animation:float 8s ease-in-out infinite}
.orb2{width:300px;height:300px;background:#7c5cfc;bottom:-50px;right:-50px;animation:float 10s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
.card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:44px 40px;margin:20px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.li{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.lt{font-size:19px;font-weight:700}.lt span{color:var(--accent)}
.form-title{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.form-sub{color:var(--muted);font-size:13.5px;margin-bottom:28px;line-height:1.5}
.fg{margin-bottom:18px}
label{display:block;font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:7px;text-transform:uppercase;letter-spacing:.8px}
.iw{position:relative}
.iw .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px 12px 40px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.12)}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:6px}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.alert{padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;display:none}
.alert.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171}
.alert.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#4ade80}
.alert.show{display:block}
.back{display:block;text-align:center;margin-top:22px;font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card">
  <div class="brand"><div class="li">⚡</div><div class="lt">Work<span>Flow</span></div></div>
  <div class="form-title">Reset your password</div>
  <div class="form-sub">Choose a new password for your account. Make it something you'll remember.</div>

  <div class="alert err" id="alertBox"></div>

  <div class="fg">
    <label>New Password</label>
    <div class="iw"><span class="ic">🔒</span><input type="password" id="newPassword" placeholder="Min 8 characters"/></div>
  </div>
  <div class="fg">
    <label>Confirm Password</label>
    <div class="iw"><span class="ic">🔒</span><input type="password" id="confirmPassword" placeholder="Repeat new password"/></div>
  </div>

  <button class="btn" id="submitBtn" onclick="resetPassword()">Reset Password</button>
  <a class="back" href="login.html">← Back to sign in</a>
</div>

<script>
function showAlert(msg, ok) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.className = 'alert show ' + (ok ? 'ok' : 'err');
}

async function resetPassword() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (!token) { showAlert('Invalid or missing reset link. Please request a new one.'); return; }
  if (!newPassword || newPassword.length < 8) { showAlert('Password must be at least 8 characters.'); return; }
  if (newPassword !== confirmPassword) { showAlert('Passwords do not match.'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Resetting...';

  try {
    const response = await fetch(
      '/api/user-auth/reset-password?token=' + encodeURIComponent(token) + '&newPassword=' + encodeURIComponent(newPassword),
      { method: 'POST' }
    );
    const data = await response.text();
    if (!response.ok) throw new Error(data || 'Failed to reset password.');

    showAlert('Password reset successfully. Redirecting to sign in...', true);
    setTimeout(() => window.location.href = 'login.html', 1800);
  } catch (error) {
    showAlert(error.message || 'Failed to reset password.');
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
}
</script>
</body>
</html>
