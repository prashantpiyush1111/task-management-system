<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow — Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0b0f;--surface:#111318;--card:#161a22;--card2:#1c2130;--border:#1e2330;--accent:#4f7cff;--accent2:#7c5cfc;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--text:#e8eaf0;--muted:#6b7280}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;position:fixed;top:0;left:0;bottom:0;z-index:50}
.sl{display:flex;align-items:center;gap:9px;padding:0 16px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.li{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.lt{font-size:17px;font-weight:700}.lt span{color:var(--accent)}
.ns{padding:0 10px;margin-top:8px}
.nl{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:0 8px;margin:12px 0 4px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;transition:all .15s;cursor:pointer;position:relative}
.ni:hover{background:var(--card);color:var(--text)}
.ni.active{background:rgba(79,124,255,.1);color:var(--accent)}
.ni.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--accent);border-radius:2px}
.nico{font-size:15px;width:18px;text-align:center}
.sf{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--border)}
.uc{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;overflow:hidden}
.av{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.un{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.logout-btn{width:100%;margin-top:6px;padding:9px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px}
.logout-btn:hover{border-color:var(--danger);color:var(--danger)}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;position:sticky;top:0;z-index:40}
.page-title{font-size:18px;font-weight:700}
.content{padding:28px;flex:1}
.report-tabs{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.rtab{padding:9px 18px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.rtab:hover{border-color:var(--accent);color:var(--accent)}
.rtab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
.report-panel{display:none}.report-panel.active{display:block}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.panel-title{font-size:15px;font-weight:700}
.input-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ri{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none;width:160px}
.ri:focus{border-color:var(--accent)}
.rb{padding:8px 16px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.rb:hover{opacity:.88}
.chart-container{position:relative;height:320px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.stat-box{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.stat-n{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-bottom:4px}
.stat-l{font-size:12px;color:var(--muted)}
.msg{color:var(--muted);font-size:13px;text-align:center;padding:40px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;z-index:999;display:none}
.toast.show{display:block}
.toast.ok{border-color:var(--success);color:#4ade80}
.toast.err{border-color:var(--danger);color:#f87171}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sl"><div class="li">⚡</div><div class="lt">Task<span>Flow</span></div></div>
  <div class="ns">
    <div class="nl">Main</div>
    <a class="ni" href="dashboard.html"><span class="nico">⊞</span>Dashboard</a>
    <a class="ni" href="issues.html"><span class="nico">📋</span>Issues</a>
    <a class="ni" href="board.html"><span class="nico">🗂</span>Board</a>
    <a class="ni" href="backlog.html"><span class="nico">📌</span>Backlog</a>
    <div class="nl">Planning</div>
    <a class="ni" href="sprints.html"><span class="nico">🏃</span>Sprints</a>
    <a class="ni active" href="reports.html"><span class="nico">📊</span>Reports</a>
    <div class="nl">Settings</div>
    <a class="ni" href="workflows.html"><span class="nico">🔄</span>Workflows</a>
    <a class="ni" href="profile.html"><span class="nico">👤</span>Profile</a>
  </div>
  <div class="sf">
    <div class="uc">
      <div class="av" id="sideAvatar">U</div>
      <div style="min-width:0;flex:1">
        <div class="un" id="sideEmail">—</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">🚪 Sign Out</button>
  </div>
</nav>
<div class="main">
  <div class="topbar"><div class="page-title">Reports & Analytics</div></div>
  <div class="content">
    <div class="report-tabs">
      <button class="rtab active" onclick="switchReport('burndown',this)">🔥 Burndown</button>
      <button class="rtab" onclick="switchReport('velocity',this)">⚡ Velocity</button>
      <button class="rtab" onclick="switchReport('sprint',this)">🏃 Sprint Report</button>
      <button class="rtab" onclick="switchReport('epic',this)">🎯 Epic Progress</button>
      <button class="rtab" onclick="switchReport('workload',this)">👥 Workload</button>
      <button class="rtab" onclick="switchReport('cumulative',this)">📈 Cumulative Flow</button>
    </div>

    <div class="report-panel active" id="rp-burndown">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">🔥 Burndown Chart</div>
          <div class="input-row">
            <input class="ri" type="number" id="bdSprintId" placeholder="Sprint ID" value="1"/>
            <button class="rb" onclick="loadBurndown()">Load</button>
          </div>
        </div>
        <div class="chart-container"><canvas id="burndownChart"></canvas></div>
      </div>
    </div>

    <div class="report-panel" id="rp-velocity">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">⚡ Velocity Report</div>
          <div class="input-row">
            <input class="ri" type="number" id="velProjId" placeholder="Project ID" value="1"/>
            <button class="rb" onclick="loadVelocity()">Load</button>
          </div>
        </div>
        <div class="chart-container"><canvas id="velocityChart"></canvas></div>
      </div>
    </div>

    <div class="report-panel" id="rp-sprint">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">🏃 Sprint Report</div>
          <div class="input-row">
            <input class="ri" type="number" id="srSprintId" placeholder="Sprint ID" value="1"/>
            <button class="rb" onclick="loadSprintReport()">Load</button>
          </div>
        </div>
        <div id="sprintReportData"><div class="msg">Enter Sprint ID and click Load</div></div>
      </div>
    </div>

    <div class="report-panel" id="rp-epic">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">🎯 Epic Progress</div>
          <div class="input-row">
            <input class="ri" type="number" id="epicId" placeholder="Epic ID" value="1"/>
            <button class="rb" onclick="loadEpic()">Load</button>
          </div>
        </div>
        <div id="epicData"><div class="msg">Enter Epic ID and click Load</div></div>
      </div>
    </div>

    <div class="report-panel" id="rp-workload">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">👥 Workload Distribution</div>
          <div class="input-row">
            <input class="ri" type="number" id="wlSprintId" placeholder="Sprint ID" value="1"/>
            <button class="rb" onclick="loadWorkload()">Load</button>
          </div>
        </div>
        <div class="chart-container"><canvas id="workloadChart"></canvas></div>
      </div>
    </div>

    <div class="report-panel" id="rp-cumulative">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">📈 Cumulative Flow</div>
          <div class="input-row">
            <input class="ri" type="number" id="cfSprintId" placeholder="Sprint ID" value="1"/>
            <button class="rb" onclick="loadCumulative()">Load</button>
          </div>
        </div>
        <div class="chart-container"><canvas id="cumulativeChart"></canvas></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
const token=localStorage.getItem('token');
if(!token)window.location.href='login.html';
const headers={'Authorization':'Bearer '+token};
const email=localStorage.getItem('userEmail')||'';
document.getElementById('sideEmail').textContent=email;
document.getElementById('sideAvatar').textContent=email?email[0].toUpperCase():'U';
function logout(){localStorage.clear();window.location.href='login.html';}

function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+type;
  setTimeout(()=>t.className='toast',2500);
}

const chartDefaults={
  responsive:true,
  maintainAspectRatio:false,
  plugins:{legend:{labels:{color:'#9ca3af',font:{family:'Space Grotesk',size:12}}}},
  scales:{
    x:{ticks:{color:'#6b7280'},grid:{color:'rgba(255,255,255,.05)'}},
    y:{ticks:{color:'#6b7280'},grid:{color:'rgba(255,255,255,.05)'}}
  }
};

let charts={};
function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

function switchReport(id,btn){
  document.querySelectorAll('.report-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.rtab').forEach(t=>t.classList.remove('active'));
  document.getElementById('rp-'+id).classList.add('active');
  btn.classList.add('active');
}

async function loadBurndown(){
  const sprintId=document.getElementById('bdSprintId').value;
  if(!sprintId){showToast('Sprint ID daalo','err');return;}
  try{
    const res=await fetch(`${API}/api/report/burndownReport/${sprintId}`,{headers});
    if(!res.ok)throw new Error();
    const data=await res.json();
    const bd=data.burnDown||{};
    if(!Object.keys(bd).length){showToast('No burndown data','err');return;}
    destroyChart('burndown');
    const ctx=document.getElementById('burndownChart').getContext('2d');
    charts.burndown=new Chart(ctx,{
      type:'line',
      data:{
        labels:Object.keys(bd),
        datasets:[{
          label:'Remaining Issues',
          data:Object.values(bd),
          borderColor:'#4f7cff',
          backgroundColor:'rgba(79,124,255,.1)',
          fill:true,
          tension:.3,
          pointBackgroundColor:'#4f7cff',
          pointRadius:4
        }]
      },
      options:chartDefaults
    });
  }catch(e){showToast('Could not load burndown data','err');}
}

async function loadVelocity(){
  const projId=document.getElementById('velProjId').value;
  if(!projId){showToast('Project ID daalo','err');return;}
  try{
    const res=await fetch(`${API}/api/report/velocityReport/${projId}`,{headers});
    if(!res.ok)throw new Error();
    const data=await res.json();
    const vel=data.velocity||{};
    if(!Object.keys(vel).length){showToast('No velocity data','err');return;}
    destroyChart('velocity');
    const ctx=document.getElementById('velocityChart').getContext('2d');
    charts.velocity=new Chart(ctx,{
      type:'bar',
      data:{
        labels:Object.keys(vel),
        datasets:[{
          label:'Issues Completed',
          data:Object.values(vel),
          backgroundColor:'rgba(124,92,252,.7)',
          borderColor:'#7c5cfc',
          borderWidth:1,
          borderRadius:6
        }]
      },
      options:chartDefaults
    });
  }catch(e){showToast('Could not load velocity data','err');}
}

async function loadSprintReport(){
  const sprintId=document.getElementById('srSprintId').value;
  if(!sprintId){showToast('Sprint ID daalo','err');return;}
  try{
    const res=await fetch(`${API}/api/report/sprintReport/${sprintId}`,{headers});
    if(!res.ok)throw new Error();
    const d=await res.json();
    document.getElementById('sprintReportData').innerHTML=`
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-n" style="color:#e8eaf0">${d.TotalIssues||0}</div><div class="stat-l">Total Issues</div></div>
        <div class="stat-box"><div class="stat-n" style="color:#4ade80">${d.CompletedIssue||0}</div><div class="stat-l">Completed</div></div>
        <div class="stat-box"><div class="stat-n" style="color:#f87171">${d.NotCompletedIssue||0}</div><div class="stat-l">Not Completed</div></div>
      </div>`;
  }catch(e){document.getElementById('sprintReportData').innerHTML='<div class="msg">Could not load sprint report</div>';}
}

async function loadEpic(){
  const epicId=document.getElementById('epicId').value;
  if(!epicId){showToast('Epic ID daalo','err');return;}
  try{
    const res=await fetch(`${API}/api/report/epicReport/${epicId}`,{headers});
    if(!res.ok)throw new Error();
    const d=await res.json();
    const pct=d.ProgressPercent||0;
    document.getElementById('epicData').innerHTML=`
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-n">${d.TotalStories||0}</div><div class="stat-l">Total Stories</div></div>
        <div class="stat-box"><div class="stat-n" style="color:#4ade80">${d.CompletedStories||0}</div><div class="stat-l">Completed</div></div>
        <div class="stat-box"><div class="stat-n" style="color:#4f7cff">${pct}%</div><div class="stat-l">Progress</div></div>
      </div>
      <div style="margin-top:20px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Progress</div>
        <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#4f7cff,#7c5cfc);border-radius:4px;transition:width .5s"></div>
        </div>
      </div>`;
  }catch(e){document.getElementById('epicData').innerHTML='<div class="msg">Could not load epic data</div>';}
}

async function loadWorkload(){
  const sprintId=document.getElementById('wlSprintId').value;
  if(!sprintId){showToast('Sprint ID daalo','err');return;}
  try{
    const res=await fetch(`${API}/api/report/workLoadReport/${sprintId}`,{headers});
    if(!res.ok)throw new Error();
    const data=await res.json();
    const wl=data.workload||{};
    if(!Object.keys(wl).length){showToast('No workload data','err');return;}
    destroyChart('workload');
    const colors=['#4f7cff','#7c5cfc','#22c55e','#f59e0b','#ef4444','#38bdf8'];
    const ctx=document.getElementById('workloadChart').getContext('2d');
    charts.workload=new Chart(ctx,{
      type:'doughnut',
      data:{
        labels:Object.keys(wl),
        datasets:[{
          data:Object.values(wl),
          backgroundColor:colors,
          borderColor:'transparent',
          borderWidth:0
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{legend:{position:'right',labels:{color:'#9ca3af',font:{family:'Space Grotesk',size:12}}}}
      }
    });
  }catch(e){showToast('Could not load workload data','err');}
}

async function loadCumulative(){
  const sprintId=document.getElementById('cfSprintId').value;
  if(!sprintId){showToast('Sprint ID daalo','err');return;}
  try{
    const res=await fetch(`${API}/api/report/cumultaive/${sprintId}`,{headers});
    if(!res.ok)throw new Error();
    const data=await res.json();
    const cf=data.CumulativeFlow||{};
    if(!Object.keys(cf).length){showToast('No cumulative data','err');return;}
    destroyChart('cumulative');
    const colors=['#4f7cff','#7c5cfc','#22c55e','#f59e0b','#ef4444','#38bdf8','#f472b6'];
    const ctx=document.getElementById('cumulativeChart').getContext('2d');
    charts.cumulative=new Chart(ctx,{
      type:'bar',
      data:{
        labels:Object.keys(cf),
        datasets:[{
          label:'Issues',
          data:Object.values(cf),
          backgroundColor:colors.slice(0,Object.keys(cf).length),
          borderRadius:6
        }]
      },
      options:{
        ...chartDefaults,
        plugins:{...chartDefaults.plugins,legend:{display:false}}
      }
    });
  }catch(e){showToast('Could not load data','err');}
}
</script>
</body>
</html>
