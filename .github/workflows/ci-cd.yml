name: Workflowpi

# Render's Auto-Deploy is already connected to this repo and deploys
# automatically on every push to main (it builds the Dockerfile itself).
# This workflow is purely a safety net: it builds the app on every push
# and pull request so broken/uncompilable code is caught early.
#
# NOTE: Unit tests are skipped in CI because TaskManagementApplicationTests
# boots the full Spring context, which needs a live DB, mail server, and
# Cloudinary credentials (DB_URL, MAIL_HOST, CLOUD_NAME, etc.) that only
# exist in the real production environment, not on GitHub's CI runner.
#
# NOTE: Render does NOT wait for this workflow to pass before deploying.
# To actually block bad code from reaching main (and therefore from
# being auto-deployed), enable a branch protection rule on "main":
#   Settings > Branches > Add rule > Require status checks to pass
#   before merging > select "Build & Test"
# That way, code only lands on main (and only then triggers Render)
# after CI is green.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven (compile only, skip tests — app needs live DB/mail/cloud env)
        run: ./mvnw -B clean package -DskipTests

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7
